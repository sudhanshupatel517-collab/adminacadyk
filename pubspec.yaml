name: acadyk
description: "Acadyk Mobile Application Workspace"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  dio: ^5.7.0
  web_socket_channel: ^3.0.1
  stomp_dart_client: ^2.1.2
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  flutter_riverpod: ^2.5.1
  provider: ^6.1.2
  go_router: ^14.2.0
  flutter_secure_storage: ^9.2.2
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  google_sign_in: ^6.2.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  timeago: ^3.7.0
  path: ^1.9.1
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/animations/
